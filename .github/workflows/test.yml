name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.7

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        run: forge test -vvv

      - name: Run Timelock fuzz invariants
        run: forge test --match-test testFuzz_Timelock --fuzz-runs 256 -vv

  evidence:
    name: Evidence and policy replay
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.7

      - name: Show tool versions
        run: |
          forge --version
          python3 --version

      - name: Check policy replay without main witness
        run: python3 scripts/check_policy_replay.py

      - name: Test policy reason mutations
        run: python3 scripts/test_policy_reason_mutations.py

      - name: Test comparative core mutations
        run: python3 scripts/check_comparison_mutations.py

      - name: Test Timelock route mutations
        run: python3 scripts/check_timelock_mutations.py

      - name: Test evidence schema boundaries
        run: python3 scripts/test_schema_boundaries.py

      - name: Test fork JSON validator without RPC
        run: python3 scripts/test_fork_result_validator.py

      - name: Compare Solidity and Python diagnostic reasons
        run: python3 scripts/check_policy_reason_matrix.py

      - name: Export and verify witness
        run: bash scripts/export_witness.sh

      - name: Test witness mutations
        run: python3 scripts/test_witness_mutations.py

  consumer:
    name: Independent Foundry consumer
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.7

      - name: Test published releases and current API
        shell: bash
        run: |
          set -euo pipefail

          consumer="$RUNNER_TEMP/sentinel-consumer"
          mkdir -p "$consumer/src" "$consumer/test" "$consumer/lib"

          cp examples/consumer/SentinelConsumer.t.sol "$consumer/test/"

          git clone --quiet --depth 1 --single-branch --branch v1.17.0             https://github.com/foundry-rs/forge-std.git             "$consumer/lib/forge-std"

          git clone --quiet --depth 1 --single-branch --branch v0.1.0             https://github.com/NothernZhongKui/protocol-sentinel.git             "$consumer/lib/protocol-sentinel"

          cat > "$consumer/foundry.toml" <<'CONFIG'
          [profile.default]
          src = "src"
          test = "test"
          out = "out"
          libs = ["lib"]
          solc_version = "0.8.24"
          auto_detect_remappings = false
          remappings = [
            "forge-std/=lib/forge-std/src/",
            "protocol-sentinel/=lib/protocol-sentinel/src/"
          ]
          CONFIG

          echo "=== Published v0.1.0 consumer ==="
          (
            cd "$consumer"
            forge test --match-path test/SentinelConsumer.t.sol -vv
          )

          echo "=== Published v0.2.0 consumer ==="
          cp examples/consumer/SentinelDetailedConsumer.t.sol "$consumer/test/"

          rm -rf "$consumer/lib/protocol-sentinel"

          git clone --quiet --depth 1 --single-branch --branch v0.2.0 https://github.com/NothernZhongKui/protocol-sentinel.git "$consumer/lib/protocol-sentinel"

          (
            cd "$consumer"
            forge test --match-path test/SentinelConsumer.t.sol -vv
            forge test --match-contract SentinelDetailedConsumerTest -vv
          )

          echo "=== Current checkout consumer ==="
          rm -rf "$consumer/lib/protocol-sentinel"
          mkdir -p "$consumer/lib/protocol-sentinel"
          cp -R "$GITHUB_WORKSPACE/src"             "$consumer/lib/protocol-sentinel/src"

          (
            cd "$consumer"
            forge test --match-path test/SentinelConsumer.t.sol -vv
          )

          (
            cd "$consumer"
            forge test --match-contract SentinelDetailedConsumerTest -vv
          )

          cp examples/consumer/SentinelComparativeConsumer.t.sol "$consumer/test/"

          echo "=== Current comparative API consumer ==="
          (
            cd "$consumer"
            forge test --match-contract SentinelComparativeConsumerTest -vv
          )

      - name: Test consumer JSON validator negative controls
        run: python3 scripts/test_timelock_consumer_validator.py

      - name: Test independent Timelock consumer
        run: bash scripts/check_timelock_consumer.sh

  comparison_c1:
    name: Comparison Evidence C1
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: evidence/python-version.txt

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.7

      - name: Install Python dependencies
        run: |
          python -m pip install -r evidence/requirements-schema.txt -r evidence/requirements-abi.txt
          python -m pip check

      - name: Verify semantics and schema
        run: |
          python scripts/test_comparison_semantics_registry.py
          python scripts/build_comparison_schema.py --check
          python scripts/test_comparison_schema_contract.py
          python scripts/test_comparison_schema_runtime.py

      - name: Verify Solidity/Python identity equivalence
        run: |
          python scripts/check_comparison_identity_vectors.py --check
          python scripts/test_comparison_identity_mutations.py

  comparison_c2:
    name: Comparison Evidence C2
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: evidence/python-version.txt

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.7

      - name: Install replay dependencies
        run: |
          python -m pip install -r evidence/requirements-schema.txt -r evidence/requirements-abi.txt
          python -m pip check

      - name: Run fresh Direct Evidence pipeline
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_direct_comparison.py

      - name: Verify completed evidence and mutations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYTEST'
          import json
          import subprocess
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path("scripts").resolve()))

          from validate_comparison_schema import (
              load_document,
              validate_document,
          )
          from replay_direct_comparison import replay
          from run_direct_comparison import verify_run_identity

          root = Path("artifacts/demo/comparison-runs/completed")

          runs = sorted(
              path for path in root.iterdir()
              if path.is_dir()
          )

          assert len(runs) == 1, f"Expected one completed run: {runs}"

          directory = runs[0]

          assert {p.name for p in directory.iterdir()} == {
              "raw-capture.json",
              "evidence.json",
              "forge-results.json",
              "verification.json",
          }

          document = load_document(directory / "evidence.json")
          report = json.loads(
              (directory / "verification.json").read_text()
          )

          assert validate_document(document)
          assert replay(document)["classification_replay"] == "MATCH"

          verify_run_identity(document, directory.name)

          assert report["run_id"] == directory.name
          assert report["producer_test"] == "Success"
          assert report["publication"] == "COMPLETED"
          assert report["comparison"] == "CHANGED_TO_VIOLATION"
          assert report["before"]["status"] == "PASS"
          assert report["after"]["status"] == "FAIL"
          assert report["source_context"] == "MATCHED_LOCAL_CHECKOUT"
          assert report["execution_provenance"] == "UNAUTHENTICATED"

          subprocess.run(
              [
                  sys.executable,
                  "scripts/test_direct_comparison_mutations.py",
                  str(directory / "evidence.json"),
              ],
              check=True,
          )

          print("PASS | Complete C2 evidence and mutations")
          PYTEST

      - name: Reject corrupted Direct assembly
        shell: bash
        run: |
          set -euo pipefail
          root="artifacts/demo/comparison-runs/completed"
          before="$(find "$root" -mindepth 1 -maxdepth 1 -type d | wc -l)"
          log="$(mktemp)"
          trap 'rm -f "$log"' EXIT

          if python scripts/run_direct_comparison.py --inject-assembly-mutation > "$log" 2>&1; then
            echo "FAIL | Corrupted evidence accepted"
            exit 1
          fi

          grep -q 'Lossless mismatch: after_candidateValidAtObservation' "$log"
          after="$(find "$root" -mindepth 1 -maxdepth 1 -type d | wc -l)"
          test "$before" = "$after"
          echo "PASS | Corrupted evidence not published"

      - name: Verify failed producer cannot publish
        shell: bash
        run: |
          set -euo pipefail

          completed="artifacts/demo/comparison-runs/completed"

          before="$(find "$completed" -mindepth 1 -maxdepth 1 -type d | wc -l)"

          python scripts/run_direct_comparison.py --inject-postwrite-failure

          after="$(find "$completed" -mindepth 1 -maxdepth 1 -type d | wc -l)"

          test "$before" = "$after"

          echo "PASS | Post-write failure did not publish evidence"

  comparison_c3:
    name: Comparison Evidence C3
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: evidence/python-version.txt

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.7

      - name: Install replay dependencies
        run: |
          python -m pip install -r evidence/requirements-schema.txt -r evidence/requirements-abi.txt
          python -m pip check

      - name: Run both real Timelock producers
        run: python scripts/run_timelock_comparison.py

      - name: Independently verify completed artifacts
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PYTEST'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path("scripts").resolve()))

          from validate_comparison_schema import (
              load_document,
              validate_document,
          )
          from replay_timelock_comparison import replay
          from run_timelock_comparison import (
              TESTS,
              check_lossless,
              check_source_context,
          )

          root = Path("artifacts/demo/comparison-runs/c3/completed")

          runs = sorted(
              path for path in root.iterdir()
              if path.is_dir()
          )

          assert len(runs) == 1, runs

          directory = runs[0]

          assert {p.name for p in directory.iterdir()} == {
              "ready-raw.json",
              "waiting-raw.json",
              "ready-evidence.json",
              "waiting-evidence.json",
              "forge-results.json",
              "verification.json",
          }

          report = json.loads(
              (directory / "verification.json").read_text()
          )

          assert report["run_id"] == directory.name
          assert report["publication"] == "COMPLETED"
          assert report["mutation_tests"] == "PASS"
          assert report["source_context"] == "MATCHED_LOCAL_CHECKOUT"
          assert report["execution_provenance"] == "UNAUTHENTICATED"

          for label, fixture in TESTS.items():
              assert report["producer_tests"][label] == "Success"

              raw = load_document(directory / f"{label}-raw.json")
              doc = load_document(directory / f"{label}-evidence.json")

              assert validate_document(doc)

              check_lossless(raw, doc)
              check_source_context(doc, directory.name)

              result = replay(doc)

              assert result["classification_replay"] == "MATCH"
              assert result["before"] == {
                  "status": "PASS", "reason": "NONE",
              }
              assert result["after"] == {
                  "status": "PASS", "reason": "NONE",
              }
              assert result["comparison"] == "STILL_SATISFIED"

              assert doc["scenario"]["spec"]["property"] == fixture["property"]

              before = doc["stages"]["before"]["observation"]
              after = doc["stages"]["after"]["observation"]

              assert before["operationStateBefore"] == fixture["state"]
              assert after["operationStateBefore"] == fixture["state"]

              assert before["outerSuccess"] is fixture["outer_success"]
              assert after["outerSuccess"] is fixture["outer_success"]

              assert before["operationId"] == after["operationId"]
              assert before["readyAt"] == after["readyAt"]

              print(f"PASS | C3 {label.upper()} verified independently")

          print("PASS | Complete C3 publication verified")
          PYTEST

      - name: Verify producer status fails closed
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PYTEST'
          import json
          from types import SimpleNamespace

          from pathlib import Path
          import sys

          sys.path.insert(0, str(Path("scripts").resolve()))

          from run_timelock_comparison import (
              SUITE, TESTS, verify_producer,
          )

          def result(entries, returncode=0, suite=SUITE):
              return SimpleNamespace(
                  returncode=returncode,
                  stdout=json.dumps({
                      "test/TimelockComparisonEvidenceCapture.t.sol:"
                      + suite: {
                          "test_results": {
                              name: {"status": status}
                              for name, status in entries
                          }
                      }
                  }),
              )

          ready = TESTS["ready"]["name"]
          waiting = TESTS["waiting"]["name"]

          valid = result([
              (ready, "Success"),
              (waiting, "Success"),
          ])

          verify_producer(valid)

          invalid = [
              result([(ready, "Success")]),
              result([
                  (ready, "Success"),
                  (waiting, "Skipped"),
              ]),
              result([
                  (ready, "Success"),
                  (waiting, "Failure"),
              ], returncode=1),
              result([
                  (ready, "Success"),
                  (waiting, "Success"),
              ], returncode=1),
              result([
                  (ready, "Success"),
                  (waiting, "Success"),
              ], suite="WrongContract"),
              result([
                  (ready, "Success"),
                  (waiting, "Success"),
                  ("test_Extra()", "Success"),
              ]),
          ]

          for index, case in enumerate(invalid):
              try:
                  verify_producer(case)
              except (RuntimeError, ValueError):
                  print(f"PASS | Rejected producer mutation {index + 1}")
              else:
                  raise AssertionError(
                      f"Producer mutation {index + 1} accepted"
                  )

          print("PASS | Producer status verification fails closed")
          PYTEST

      - name: Verify post-write failure cannot publish
        shell: bash
        run: |
          set -euo pipefail

          completed="artifacts/demo/comparison-runs/c3/completed"

          before="$(find "$completed" -mindepth 1 -maxdepth 1 -type d | wc -l)"

          python scripts/run_timelock_comparison.py --inject-postwrite-failure

          after="$(find "$completed" -mindepth 1 -maxdepth 1 -type d | wc -l)"

          test "$before" = "$after"

          echo "PASS | Failed C3 producer cannot publish"

  comparison_c4:
    name: Comparison Evidence C4
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: evidence/python-version.txt

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.7

      - name: Install evidence dependencies
        run: |
          python -m pip install -r evidence/requirements-schema.txt -r evidence/requirements-abi.txt
          python -m pip check

      - name: Run complete C4 acceptance
        run: bash scripts/run_comparison_c4.sh

  x402:
    name: Fortytwo external regression
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.7

      - name: Verify reproduction script
        run: bash -n scripts/reproduce_x402.sh

      - name: Run Fortytwo PASS FAIL PASS regression
        run: bash scripts/reproduce_x402.sh
