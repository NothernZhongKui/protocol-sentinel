name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.7

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        run: forge test -vvv

      - name: Run Timelock fuzz invariants
        run: forge test --match-test testFuzz_Timelock --fuzz-runs 256 -vv

  evidence:
    name: Evidence and policy replay
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.7

      - name: Show tool versions
        run: |
          forge --version
          python3 --version

      - name: Check policy replay without main witness
        run: python3 scripts/check_policy_replay.py

      - name: Test policy reason mutations
        run: python3 scripts/test_policy_reason_mutations.py

      - name: Test comparative core mutations
        run: python3 scripts/check_comparison_mutations.py

      - name: Test Timelock route mutations
        run: python3 scripts/check_timelock_mutations.py

      - name: Test evidence schema boundaries
        run: python3 scripts/test_schema_boundaries.py

      - name: Test fork JSON validator without RPC
        run: python3 scripts/test_fork_result_validator.py

      - name: Compare Solidity and Python diagnostic reasons
        run: python3 scripts/check_policy_reason_matrix.py

      - name: Export and verify witness
        run: bash scripts/export_witness.sh

      - name: Test witness mutations
        run: python3 scripts/test_witness_mutations.py

  consumer:
    name: Independent Foundry consumer
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.7

      - name: Test published releases and current API
        shell: bash
        run: |
          set -euo pipefail

          consumer="$RUNNER_TEMP/sentinel-consumer"
          mkdir -p "$consumer/src" "$consumer/test" "$consumer/lib"

          cp examples/consumer/SentinelConsumer.t.sol "$consumer/test/"

          git clone --quiet --depth 1 --single-branch --branch v1.17.0             https://github.com/foundry-rs/forge-std.git             "$consumer/lib/forge-std"

          git clone --quiet --depth 1 --single-branch --branch v0.1.0             https://github.com/NothernZhongKui/protocol-sentinel.git             "$consumer/lib/protocol-sentinel"

          cat > "$consumer/foundry.toml" <<'CONFIG'
          [profile.default]
          src = "src"
          test = "test"
          out = "out"
          libs = ["lib"]
          solc_version = "0.8.24"
          auto_detect_remappings = false
          remappings = [
            "forge-std/=lib/forge-std/src/",
            "protocol-sentinel/=lib/protocol-sentinel/src/"
          ]
          CONFIG

          echo "=== Published v0.1.0 consumer ==="
          (
            cd "$consumer"
            forge test --match-path test/SentinelConsumer.t.sol -vv
          )

          echo "=== Published v0.2.0 consumer ==="
          cp examples/consumer/SentinelDetailedConsumer.t.sol "$consumer/test/"

          rm -rf "$consumer/lib/protocol-sentinel"

          git clone --quiet --depth 1 --single-branch --branch v0.2.0 https://github.com/NothernZhongKui/protocol-sentinel.git "$consumer/lib/protocol-sentinel"

          (
            cd "$consumer"
            forge test --match-path test/SentinelConsumer.t.sol -vv
            forge test --match-contract SentinelDetailedConsumerTest -vv
          )

          echo "=== Current checkout consumer ==="
          rm -rf "$consumer/lib/protocol-sentinel"
          mkdir -p "$consumer/lib/protocol-sentinel"
          cp -R "$GITHUB_WORKSPACE/src"             "$consumer/lib/protocol-sentinel/src"

          (
            cd "$consumer"
            forge test --match-path test/SentinelConsumer.t.sol -vv
          )

          (
            cd "$consumer"
            forge test --match-contract SentinelDetailedConsumerTest -vv
          )

          cp examples/consumer/SentinelComparativeConsumer.t.sol "$consumer/test/"

          echo "=== Current comparative API consumer ==="
          (
            cd "$consumer"
            forge test --match-contract SentinelComparativeConsumerTest -vv
          )

      - name: Test consumer JSON validator negative controls
        run: python3 scripts/test_timelock_consumer_validator.py

      - name: Test independent Timelock consumer
        run: bash scripts/check_timelock_consumer.sh

  comparison_c1:
    name: Comparison Evidence C1
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: evidence/python-version.txt

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.7

      - name: Install Python dependencies
        run: |
          python -m pip install -r evidence/requirements-schema.txt -r evidence/requirements-abi.txt
          python -m pip check

      - name: Verify semantics and schema
        run: |
          python scripts/test_comparison_semantics_registry.py
          python scripts/build_comparison_schema.py --check
          python scripts/test_comparison_schema_contract.py
          python scripts/test_comparison_schema_runtime.py

      - name: Verify Solidity/Python identity equivalence
        run: |
          python scripts/check_comparison_identity_vectors.py --check
          python scripts/test_comparison_identity_mutations.py

  comparison_c2:
    name: Comparison Evidence C2
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: evidence/python-version.txt

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.7

      - name: Install replay dependencies
        run: |
          python -m pip install -r evidence/requirements-schema.txt -r evidence/requirements-abi.txt
          python -m pip check

      - name: Run fresh Direct Evidence pipeline
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_direct_comparison.py

      - name: Verify completed evidence and mutations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYTEST'
          import json
          import subprocess
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path("scripts").resolve()))

          from validate_comparison_schema import (
              load_document,
              validate_document,
          )
          from replay_direct_comparison import replay
          from run_direct_comparison import verify_run_identity

          root = Path("artifacts/demo/comparison-runs/completed")

          runs = sorted(
              path for path in root.iterdir()
              if path.is_dir()
          )

          assert len(runs) == 1, f"Expected one completed run: {runs}"

          directory = runs[0]

          assert {p.name for p in directory.iterdir()} == {
              "raw-capture.json",
              "evidence.json",
              "forge-results.json",
              "verification.json",
          }

          document = load_document(directory / "evidence.json")
          report = json.loads(
              (directory / "verification.json").read_text()
          )

          assert validate_document(document)
          assert replay(document)["classification_replay"] == "MATCH"

          verify_run_identity(document, directory.name)

          assert report["run_id"] == directory.name
          assert report["producer_test"] == "Success"
          assert report["publication"] == "COMPLETED"
          assert report["comparison"] == "CHANGED_TO_VIOLATION"
          assert report["before"]["status"] == "PASS"
          assert report["after"]["status"] == "FAIL"
          assert report["source_context"] == "MATCHED_LOCAL_CHECKOUT"
          assert report["execution_provenance"] == "UNAUTHENTICATED"

          subprocess.run(
              [
                  sys.executable,
                  "scripts/test_direct_comparison_mutations.py",
                  str(directory / "evidence.json"),
              ],
              check=True,
          )

          print("PASS | Complete C2 evidence and mutations")
          PYTEST

      - name: Verify failed producer cannot publish
        shell: bash
        run: |
          set -euo pipefail

          completed="artifacts/demo/comparison-runs/completed"

          before="$(find "$completed" -mindepth 1 -maxdepth 1 -type d | wc -l)"

          python scripts/run_direct_comparison.py --inject-postwrite-failure

          after="$(find "$completed" -mindepth 1 -maxdepth 1 -type d | wc -l)"

          test "$before" = "$after"

          echo "PASS | Post-write failure did not publish evidence"

  x402:
    name: Fortytwo external regression
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.7

      - name: Verify reproduction script
        run: bash -n scripts/reproduce_x402.sh

      - name: Run Fortytwo PASS FAIL PASS regression
        run: bash scripts/reproduce_x402.sh
